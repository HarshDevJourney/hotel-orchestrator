services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  temporal:
    image: temporalio/temporal:latest
    command: ["server", "start-dev", "--ip", "0.0.0.0"]
    ports:
      - "7233:7233" # gRPC
      - "8233:8233" # Web UI

  api:
    build: ./backend
    command: ["node", "dist/main/server.js"]
    environment: &app-env
      PORT: 3000
      LOG_LEVEL: info
      REDIS_URL: redis://redis:6379
      TEMPORAL_ADDRESS: temporal:7233
      SUPPLIER_BASE_URL: http://api:3000
    ports:
      - "3000:3000"
    depends_on:
      redis:
        condition: service_healthy
      temporal:
        condition: service_started

  worker:
    build: ./backend
    command: ["node", "dist/main/worker.js"]
    environment: *app-env
    depends_on:
      redis:
        condition: service_healthy
      temporal:
        condition: service_started
      api:
        condition: service_started

  frontend:
    build: ./frontend
    environment:
      BACKEND_URL: http://api:3000
    ports:
      - "8080:80"
    depends_on:
      - api
